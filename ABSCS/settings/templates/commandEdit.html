    <style>
        .table-container {
            width: 90%; /* Limits table width */
            max-width: 800px; /* Prevents it from becoming too wide */
            margin: auto; /* Centers the table */
            overflow-x: auto; /* Enables scrolling if needed */
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
        border: 1px solid #ccc;
        padding: 8px;
        }
        thead th {
        background-color: #f0f0f0;
        font-weight: bold;
        }

        .table-container img {
            max-width: 1em;
            max-height: 1em; /* Limits image height */
            object-fit: contain; /* Ensures full image is visible */
        }

        .command-wrapper {
  max-width: 75%;       /* or whatever fixed width you want */
  margin: 20px auto;      /* centers it on the page */
  border: 1px solid #ccc;
  border-radius: 4px;
  overflow: hidden;
}

        .command-header {
            background-color: #b71c1c; /* Deep red */
            color: white;
            padding: 8px 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            border: 1px solid #999;
            border-bottom: none;
            }

            .command-tab {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            flex-grow: 1;
            padding: 0;
            }

            .command-tab:hover {
            text-decoration: underline;
            }

            .delete-btn {
            background-color: #e53935;
            color: white;
            border: none;
            }

            
            .delete-btn:hover {
            background-color: #c62828;
            }

            .save-button-container {
            text-align: right;
            margin-top: 20px;
            padding-right: 10px; /* Adds space from right edge */
            padding-bottom: 10px;
            }

            .save-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            }

            .save-btn:hover {
            background-color: #388e3c;
            }

            .opcode-input-group {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
            }

            .opcode-input-group label {
            font-weight: bold;
            min-width: 60px;
            }

            #opcode-input {
            flex-grow: 1;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
            }

    </style>

                            </div>
                            <table class="table table-bordered text-center">

                                    </td>
                                    </tr>
                                    <tr>
                                    <td></td>
                                    <td colspan="3"><button class="btn btn-outline-secondary w-100">+</button></td>
                                    </tr>
                                </tbody>
                                </table>
                        </div>
                        <div class="save-button-container">
                            <button class="save-btn">SAVE</button>
                        </div>
                    </div>
                {% endfor %}

    <script>

        function add_command(event){
            
            let command_name = event.target.elements["name"].value;
            let command_encoding = event.target.elements["encoding"].value;
            let command_content = event.target.elements["command_content"].value;

            if (command_encoding === "Binary" && (command_content.length % 8 !== 0 || command_content.length === 0)) {
                alert("Binary string length must be a non-zero multiple of 8.");
                return false;  // Prevent form submission
            }

            

            /*
            let nameInput = table.querySelector(".mnemonic_name_field");
            let typeInput = table.querySelector(".mnemonic_type_field");
            let unitInput = table.querySelector(".mnemonic_unit_field");
            */
            let addUrl = "{% url 'add_command' %}"
            
            fetch(addUrl,{
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    
                },
                body: JSON.stringify({ name: command_name, encoding_type: command_encoding, command_content: command_content })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Server response:", data);
                table.innerHTML = "";
            })
            .catch(error => console.error('Error', error));
        }

        function delete_mnemonic(event, id){
            let table = document.getElementById("mnemonic"+String(id));

            let editUrl = "{% url 'edit_mnemonic' id=0 %}".replace("0", id);

            fetch(editUrl,{
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json",
                    
                },
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .then(data => {
                console.log("Server response:", data);
                table.innerHTML = "";
            })
            .catch(error => console.error('Error', error));
        }

        function update_mnemonic(event, id){

            let mnemonic_name = event.target.name.value;
            let mnemonic_type = event.target.type.value;
            let mnemonic_unit = event.target.unit.value;
            
            let table = document.getElementById("mnemonic"+String(id));
            let nameInput = table.querySelector(".mnemonic_name_field");
            let typeInput = table.querySelector(".mnemonic_type_field");
            let unitInput = table.querySelector(".mnemonic_unit_field");
            
            let editUrl = "{% url 'edit_mnemonic' id=0 %}".replace("0", id);
            console.log(editUrl);
            
            fetch(editUrl,{
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    
                },
                body: JSON.stringify({ name: mnemonic_name, type: mnemonic_type, unit: mnemonic_unit })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Server response:", data);
                console.log(data['name']);
                nameInput.innerHTML = data["name"];
                typeInput.innerHTML = data["type"];
                unitInput.innerHTML = data["unit"];
            })
            .catch(error => console.error('Error', error));
        
            
        }
        
    </script>
